name: Artist Workspace
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: astral-sh/setup-uv@v7
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg rubberband-cli libsndfile1
      - run: npm run setup
      - run: npm run build
      - run: npm test
